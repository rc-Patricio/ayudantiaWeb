{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>eShop</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/inicio.css' %}">

</head>
<body>

<header class="py-2">
    <div class="container d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold">TIENDA.CL</h4>
        <div class="d-flex flex-row align-items center gap-3">
            <div class="d-flex flex-column align-items-center gap-3">
                <div class="text-end">
                    <div class="small">Carro de Compra</div>
                    <div class="fw-bold">0 productos</div>
                </div>
                <div class="btn-group mt-2">
                    <button class="btn btn-light btn-sm">Ver carro</button>
                    <button class="btn btn-dark btn-sm">Comprar</button>
                </div>
                
            </div>
            <div class="d-flex flex-column gap-3 justify-content-center">
                {% if user.is_authenticated %}
                    <h1>Bienvenido {{ user.username }}</h1>
                    <a class="btn btn-dark btn-sm" href="/logout/">Logout</a>
                {% else %}
                    <a class="btn btn-dark btn-sm" href="/sesion/">Sesión</a>
                {% endif %}
                    
            </div>
        </div>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark navbar-dark-custom">
    <div class="container">
        <div class="navbar-nav">
            <a class="nav-link text-white" href="/">INICIO</a>
            <a class="nav-link text-white" href="/cat1/">CATEGORIA1</a>
            <a class="nav-link text-white" href="/cat2/">CATEGORIA2</a>
        </div>
    </div>
</nav>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
